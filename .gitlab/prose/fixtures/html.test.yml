- name: Julia default expressions remain code in rendered fields
  format: html
  input: |
    <p><code>limits::Limits</code>: provenance. Default: Limits()</p>
  contains: Project.BannedTerms
  absent:
    - Project.ColonUsage
- name: Julia default expressions end at the field paragraph
  format: html
  input: |
    <p><code>powerflow::NamedTuple</code>: power-flow seeds. Default: map((input-&gt;begin #= /home/builder/src/MMC.jl:63 =# input.default end), <em>CONVERTER</em>INPUTS)</p>
    <p>Note: Contract.</p>
  contains: '2:'
  absent:
    - '1:'
