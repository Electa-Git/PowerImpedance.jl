name: Release CI

run-name: Validate ${{ github.ref_name }} publication

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-publication:
    name: Validate published release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail

          release_version="$({ sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Project.toml || true; } | head -n 1)"
          expected_tag="v${release_version}"

          test -n "$release_version" || {
            echo "Could not read the package version from Project.toml."
            exit 1
          }

          test "$GITHUB_REF_NAME" = "$expected_tag" || {
            echo "Tag $GITHUB_REF_NAME does not match Project.toml version $expected_tag."
            exit 1
          }

          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$tag_commit" = "$GITHUB_SHA" || {
            echo "The workflow commit does not match the published tag."
            exit 1
          }

          # TagBot tags the registered source, which may precede today's main.
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main || {
            echo "The registered release commit is not in GitHub main history."
            exit 1
          }

          echo "Validated $GITHUB_REF_NAME at $tag_commit."

  deploy-documentation:
    name: Deploy registered release documentation
    needs: validate-publication
    if: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, '+') }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    env:
      POWERIMPEDANCE_DOCS_TARGET: github
      JULIA_PKG_PRECOMPILE_AUTO: "0"
      JULIA_NUM_THREADS: "2,0"
      JULIA_NUM_PRECOMPILE_TASKS: "2"
    steps:
      - name: Check out the registered tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.6"

      - uses: julia-actions/cache@v2

      - name: Instantiate the documentation environment
        run: |
          julia --project=docs --startup-file=no -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            Pkg.precompile()
          '

      - name: Refresh optional user statistics
        continue-on-error: true
        run: timeout 10m julia --project=docs/statistics --startup-file=no docs/statistics/make.jl

      - name: Build and deploy the stable documentation
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: |
          julia --project=docs --startup-file=no -e '
            include("docs/make.jl")
            include("docs/deploy_github.jl")
          '
